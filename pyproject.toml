[project]
name = "agent-spend-guard"
version = "0.1.0"
description = "Unofficial guard and eval suite for AI agents that pay. Not affiliated with Saifuro."
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "fastapi",
    "uvicorn",
    "httpx",
    "pyjwt[crypto]",
    "langchain>=1.4.7",
    "langgraph>=1.2.18",
    "langchain-anthropic>=1.7.6",
    "mcp>=2.3.0",
]

[dependency-groups]
dev = ["pytest"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
